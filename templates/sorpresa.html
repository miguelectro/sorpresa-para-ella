<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para ti 💗</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    #fff4a8 0 5%,
                    transparent 6%
                ),

                radial-gradient(
                    circle at 85% 15%,
                    #ffd1e8 0 6%,
                    transparent 7%
                ),

                radial-gradient(
                    circle at 20% 85%,
                    #ffe8f3 0 7%,
                    transparent 8%
                ),

                linear-gradient(
                    135deg,
                    #fff8b8,
                    #ffd9eb,
                    #fff0a8
                );

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            position: relative;

        }


        .decoracion {

            position: absolute;

            font-size: 35px;

            animation:
                flotar 4s ease-in-out infinite;

            pointer-events: none;

        }


        .d1 {

            top: 8%;

            left: 8%;

        }


        .d2 {

            top: 15%;

            right: 10%;

            animation-delay: 1s;

        }


        .d3 {

            bottom: 12%;

            left: 10%;

            animation-delay: 2s;

        }


        .d4 {

            bottom: 15%;

            right: 8%;

            animation-delay: 1.5s;

        }


        .d5 {

            top: 45%;

            left: 3%;

            animation-delay: 0.5s;

        }


        .d6 {

            top: 50%;

            right: 3%;

            animation-delay: 2.5s;

        }


        .contenedor {

            width: min(90%, 650px);

            padding:
                35px
                25px
                30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.78
                );

            border:
                3px solid
                rgba(
                    255,
                    183,
                    210,
                    0.8
                );

            border-radius: 30px;

            text-align: center;

            box-shadow:

                0 15px 40px
                rgba(
                    255,
                    120,
                    170,
                    0.25
                ),

                inset 0 0 25px
                rgba(
                    255,
                    255,
                    255,
                    0.7
                );

            animation:
                aparecer 1s ease;

        }


        .mensaje-superior {

            color: #d85b8c;

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .flores {

            width:
                min(
                    100%,
                    420px
                );

            margin:
                0 auto 10px;

        }


        .flores svg {

            width: 100%;

            height: auto;

            display: block;

        }


        h1 {

            margin:
                5px 0 15px;

            color: #d94f85;

            font-size:
                clamp(
                    30px,
                    7vw,
                    48px
                );

            text-shadow:

                2px 2px 0 #fff,

                0 4px 10px
                rgba(
                    220,
                    80,
                    130,
                    0.2
                );

        }


        .mensaje {

            color: #7d5063;

            font-size: 18px;

            line-height: 1.6;

            margin:
                0 auto 25px;

            max-width: 520px;

        }


        .boton-entrar {

            display: inline-block;

            padding:
                15px
                30px;

            border: none;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #ff82b4,
                    #e95791
                );

            color: white;

            font-size: 19px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            box-shadow:

                0 8px 20px
                rgba(
                    225,
                    80,
                    140,
                    0.3
                );

            transition:

                transform 0.2s ease,

                box-shadow 0.2s ease;

        }


        .boton-entrar:hover {

            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:

                0 12px 25px
                rgba(
                    225,
                    80,
                    140,
                    0.4
                );

        }


        .boton-entrar:active {

            transform:
                scale(0.96);

        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.96);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes flotar {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-5deg);

            }

            50% {

                transform:
                    translateY(-12px)
                    rotate(5deg);

            }

        }


        @media (max-width: 600px) {

            .contenedor {

                padding:
                    25px
                    18px
                    25px;

                border-radius: 25px;

            }


            .mensaje-superior {

                font-size: 17px;

            }


            .mensaje {

                font-size: 16px;

            }


            .boton-entrar {

                font-size: 17px;

                padding:
                    14px
                    25px;

            }


            .decoracion {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="decoracion d1">
        💗
    </div>


    <div class="decoracion d2">
        🌸
    </div>


    <div class="decoracion d3">
        🎀
    </div>


    <div class="decoracion d4">
        💛
    </div>


    <div class="decoracion d5">
        🌼
    </div>


    <div class="decoracion d6">
        💕
    </div>


    <div class="contenedor">


        <div class="mensaje-superior">

            siiiii esa biscochitoooo jajaja te amo... 💗

        </div>


        <div class="flores">


            <svg
                viewBox="0 0 500 420"
                xmlns="http://www.w3.org/2000/svg"
            >


                <!-- tallos -->

                <path
                    d="M250 380 C245 300 245 210 250 100"
                    stroke="#5fa84f"
                    stroke-width="10"
                    fill="none"
                    stroke-linecap="round"
                />


                <path
                    d="M250 330 C205 270 155 230 105 205"
                    stroke="#5fa84f"
                    stroke-width="9"
                    fill="none"
                    stroke-linecap="round"
                />


                <path
                    d="M250 325 C300 265 350 225 400 205"
                    stroke="#5fa84f"
                    stroke-width="9"
                    fill="none"
                    stroke-linecap="round"
                />


                <!-- hojas -->

                <ellipse
                    cx="190"
                    cy="285"
                    rx="55"
                    ry="22"
                    fill="#69b858"
                    transform="rotate(25 190 285)"
                />


                <ellipse
                    cx="310"
                    cy="280"
                    rx="55"
                    ry="22"
                    fill="#69b858"
                    transform="rotate(-25 310 280)"
                />


                <!-- flor izquierda -->

                <g
                    transform="translate(105 190)"
                >

                    <circle
                        cx="0"
                        cy="-35"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="-35"
                        cy="0"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="35"
                        cy="0"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="0"
                        cy="35"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="0"
                        cy="0"
                        r="28"
                        fill="#f5a623"
                    />

                </g>


                <!-- flor central -->

                <g
                    transform="translate(250 90)"
                >

                    <circle
                        cx="0"
                        cy="-38"
                        r="38"
                        fill="#ffe34d"
                    />

                    <circle
                        cx="-38"
                        cy="0"
                        r="38"
                        fill="#ffe34d"
                    />

                    <circle
                        cx="38"
                        cy="0"
                        r="38"
                        fill="#ffe34d"
                    />

                    <circle
                        cx="0"
                        cy="38"
                        r="38"
                        fill="#ffe34d"
                    />

                    <circle
                        cx="0"
                        cy="0"
                        r="30"
                        fill="#f4a51c"
                    />

                </g>


                <!-- flor derecha -->

                <g
                    transform="translate(400 190)"
                >

                    <circle
                        cx="0"
                        cy="-35"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="-35"
                        cy="0"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="35"
                        cy="0"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="0"
                        cy="35"
                        r="34"
                        fill="#ffd83d"
                    />

                    <circle
                        cx="0"
                        cy="0"
                        r="28"
                        fill="#f5a623"
                    />

                </g>


                <!-- cinta -->

                <path
                    d="M250 315
                       C220 295 190 305 180 330
                       C205 350 230 345 250 325
                       C270 345 295 350 320 330
                       C310 305 280 295 250 315Z"
                    fill="#f58bb5"
                />


                <circle
                    cx="250"
                    cy="320"
                    r="18"
                    fill="#ed6fa4"
                />


            </svg>

        </div>


        <h1>

            🌻 Para ti, mi amor 🌻

        </h1>


        <p class="mensaje">

            Porque hoy quería regalarte algo
            tan bonito como tú.

            Estas flores son para recordarte
            lo especial que eres para mí. 💛

        </p>


        <a
            id="botonEntra"
            class="boton-entrar"
            href="{{ url_for('menu') }}"
        >

            💗 Entra aquí 💗

        </a>


    </div>


</body>

</html>
