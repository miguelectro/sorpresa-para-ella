        <!-- MÚSICA -->

        <audio

            loop
        >

            <source
                src="{{ url_for('static', filename='musica.mp3') }}"
                type="audio/mpeg"
            >

        </audio>


    </main>


    <script>
    const musica = document.getElementById("musica");

    musica.volume = 0.7;
    musica.loop = true;

    musica.play().catch(() => {
        console.log("El navegador bloqueó el autoplay.");
    });

    // Guardar el segundo actual de la canción
    setInterval(() => {
        if (!musica.paused && !musica.ended) {
            sessionStorage.setItem(
                "tiempoMusica",
                musica.currentTime
            );
        }
    }, 200);

    // Guardar también al salir de esta página
    window.addEventListener("beforeunload", () => {
        sessionStorage.setItem(
            "tiempoMusica",
            musica.currentTime
        );
    });
</script>
