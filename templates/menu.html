>

<script>

    const musica =
        document.getElementById("musica");


    musica.volume = 0.7;

    musica.loop = true;


    // Recuperar el tiempo anterior

    const tiempoGuardado =
        sessionStorage.getItem(
            "tiempoMusica"
        );


    if (tiempoGuardado !== null) {

        musica.addEventListener(
            "loadedmetadata",
            () => {

                musica.currentTime =
                    parseFloat(
                        tiempoGuardado
                    );

            },
            {
                once: true
            }
        );

    }


    // Intentar reproducir

    musica.play().catch(() => {

        console.log(
            "El navegador bloqueó el autoplay."
        );

    });


    // Guardar constantemente el momento de la canción

    setInterval(() => {

        if (!musica.paused) {

            sessionStorage.setItem(
                "tiempoMusica",
                musica.currentTime
            );

        }

    }, 200);


    // Guardar exactamente antes de cambiar de página

    window.addEventListener(
        "beforeunload",
        () => {

            sessionStorage.setItem(
                "tiempoMusica",
                musica.currentTime
            );

        }
    );

</script>

<script>

    /* =========================
       COMPROBAR PROGRESO
    ========================= */

    const cartaCompletada =
        localStorage.getItem(
            "cartaCompletada"
        ) === "true";


    const recuerdoCompletado =
        localStorage.getItem(
            "recuerdoCompletado"
        ) === "true";


    const juegoCompletado =
        localStorage.getItem(
            "juegoCompletado"
        ) === "true";


    const todasCompletadas =
        cartaCompletada &&
        recuerdoCompletado &&
        juegoCompletado;


    const botonSorpresa =
        document.getElementById(
            "botonSorpresa"
        );


    const emojiSorpresa =
        document.getElementById(
            "emojiSorpresa"
        );


    const textoSorpresa =
        document.getElementById(
            "textoSorpresa"
        );


    const mensajeBloqueo =
        document.getElementById(
            "mensajeBloqueo"
        );


    /* =========================
       DESBLOQUEAR
    ========================= */

    if (todasCompletadas) {

        botonSorpresa.classList.remove(
            "sorpresa-bloqueada"
        );

        botonSorpresa.classList.add(
            "sorpresa-desbloqueada"
        );

        emojiSorpresa.textContent =
            "🎁💗";

        textoSorpresa.textContent =
            "Sorpresa final";


        mensajeBloqueo.textContent =
            "✨ ¡Ya desbloqueaste la sorpresa final! ✨";


        botonSorpresa.onclick = () => {

            window.location.href =
                "{{ url_for('sorpresa_final') }}";

        };

    }


    /* =========================
       SI ESTÁ BLOQUEADA
    ========================= */

    else {

        botonSorpresa.onclick = () => {

            alert(
                "💗 Todavía faltan algunas sorpresas por descubrir..."
            );

        };

    }

</script>
